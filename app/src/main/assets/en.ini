1 rules_popup {

The Mainstream rules are simple.
Help Octy to go as far as possible. 
Try to set a new day and all time best results.
Octy moves in a main stream. 
It goes slightly down to the seabed all the time. 
Move Octy up by pressing "OK" button. 
Avoid any touches - this will harm the octopus. 
Collect ink bottles to refill octopus health ink bulb 
in the top left screen corner.

Enjoy!
}
