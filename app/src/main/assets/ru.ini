1 rules_popup {

Играть в Mainstream очень просто.
Помогите осьминогу Окти пройти как можно
дальше. Устанавливайте все новые и новые 
рекорды. Осьминог движется по течению, 
постоянно приближаясь ко дну. 
Подталкивайте осьминога вверх, 
нажимая кнопку "ОК". Избегайте любых касаний, 
которые причиняют вред осьминогу. 
Подбирайте бутылочки с чернилами 
для восстановления здоровья Окти.

Наслаждайтесь игрой!
}
