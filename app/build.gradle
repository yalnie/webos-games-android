apply plugin: 'com.android.application'

android {
    namespace 'com.ru.lgerp.mainstream'
    compileSdk 36

    defaultConfig {
        applicationId "com.ru.lgerp.mainstream"
        minSdkVersion 21
        targetSdk 36
        versionCode 1
        versionName "1.0.16"

        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Standard android
}
